name: Build ClipCutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f "ClipCutter.zip" ]; then
            unzip -o ClipCutter.zip -d extracted
          else
            echo "ClipCutter.zip not found in repo root!"
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: extracted/ClipCutter
        run: gradle wrapper --gradle-version 8.7

      - name: Patch Groovy DSL syntax (fix isMinifyEnabled error)
        run: |
          sed -i 's/isMinifyEnabled = false/minifyEnabled false/' extracted/ClipCutter/app/build.gradle
          cat extracted/ClipCutter/app/build.gradle

      - name: Build debug APK
        working-directory: extracted/ClipCutter
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipCutter-debug-apk
          path: extracted/ClipCutter/app/build/outputs/apk/debug/app-debug.apk
