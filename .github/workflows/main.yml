name: Build ClipCutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f "ClipCutter.zip" ]; then
            unzip -o ClipCutter.zip -d extracted
          else
            echo "ClipCutter.zip not found in repo root!"
            ls -la
            exit 1
          fi

      - name: Patch Gradle files (fix syntax + dead ffmpeg-kit dependency)
        run: |
          sed -i 's/isMinifyEnabled = false/minifyEnabled false/' extracted/ClipCutter/app/build.gradle
          sed -i 's/com.arthenica:ffmpeg-kit-full-gpl:[^"]*/com.antonkarpenko:ffmpeg-kit-full-gpl:2.1.0/' extracted/ClipCutter/app/build.gradle
          cat extracted/ClipCutter/app/build.gradle

      - name: Fix LocalBroadcastManager import bug
        run: |
          find extracted/ClipCutter/app/src/main/java -name "*.kt" -exec \
            sed -i 's/androidx\.core\.content\.LocalBroadcastManager/androidx.localbroadcastmanager.content.LocalBroadcastManager/g' {} +

      - name: Detect real ffmpeg-kit package name and patch imports
        run: |
          curl -sSL -o /tmp/ffmpegkit.aar \
            https://repo1.maven.org/maven2/com/antonkarpenko/ffmpeg-kit-full-gpl/2.1.0/ffmpeg-kit-full-gpl-2.1.0.aar
          mkdir -p /tmp/aarcontents
          unzip -o /tmp/ffmpegkit.aar -d /tmp/aarcontents
          CLASS_PATH=$(unzip -l /tmp/aarcontents/classes.jar | grep -m1 -o '[A-Za-z0-9/_]*FFmpegKit\.class' || true)
          if [ -z "$CLASS_PATH" ]; then
            echo "Could not auto-detect package, falling back to com.arthenica.ffmpegkit"
            PKG="com.arthenica.ffmpegkit"
          else
            PKG=$(dirname "$CLASS_PATH" | tr '/' '.')
          fi
          echo "Detected ffmpeg-kit package: $PKG"
          find extracted/ClipCutter/app/src/main/java -name "*.kt" -exec \
            sed -i "s/com\.arthenica\.ffmpegkit/$PKG/g" {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: extracted/ClipCutter
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: extracted/ClipCutter
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipCutter-debug-apk
          path: extracted/ClipCutter/app/build/outputs/apk/debug/app-debug.apk
